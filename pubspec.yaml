name: ethiomark8
description: "A new Ethiopia-focused marketplace and job-listing app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.3.0
  connectivity_plus: ^7.0.0
  http: ^1.6.0
  provider: ^6.1.5+1
  google_fonts: ^6.3.3
  carousel_slider: ^5.1.1
  image_picker: ^1.2.1
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.2
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.3+2
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
